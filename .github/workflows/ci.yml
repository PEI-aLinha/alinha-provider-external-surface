# Tests THIS plugin inside the main repo (which has the core and the other plugins) and sends the analysis
# and coverage to this repo's SonarCloud project. The steps live in the main repo:
# PEI-aLinha/alinha/.github/workflows/plugin-ci.yml
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read   # SonarCloud PR decoration

jobs:
  ci:
    # Coordinated change with PEI-aLinha/alinha (job_consumer net module, OpenAPI contract, pnpm-lock.yaml): test
    # against the main repo's branch of the same name. Back to @main, without main-ref, before merging.
    uses: PEI-aLinha/alinha/.github/workflows/plugin-ci.yml@feat/external-surface-provider
    with:
      main-ref: feat/external-surface-provider
      plugin-path: plugins/provider/external-surface
      gradle-project: external-surface
      npm-package: "@alinha/plugin-external-surface"
    secrets:
      ALINHA_READ_TOKEN: ${{ secrets.ALINHA_READ_TOKEN }}   # private repos only
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
